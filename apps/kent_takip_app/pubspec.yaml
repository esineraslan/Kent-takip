name: kent_takip_app
description: İBB Kent Takip citizen and municipal demo shell.
publish_to: none
version: 0.2.0-rc.2+1
resolution: workspace

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0 <3.48.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: 17.5.0
  flutter_map: 8.3.1
  http: 1.6.0
  image_picker: 1.2.3
  kent_takip_application:
    path: ../../packages/kent_takip_application
  kent_takip_contracts:
    path: ../../packages/kent_takip_contracts
  kent_takip_domain:
    path: ../../packages/kent_takip_domain
  kent_takip_persistence:
    path: ../../packages/kent_takip_persistence
  latlong2: 0.10.1
  provider: 6.1.5+1
  path_provider: 2.1.6
  web: 1.1.1
  web_socket_channel: 3.0.3

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/demo_data/v1/
    - assets/demo_media/original/
    - assets/demo_media/public/
    - assets/map/
